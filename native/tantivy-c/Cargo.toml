[package]
name = "tantivy-c"
version = "0.1.0"
edition = "2021"
description = "C ABI wrapper around Tantivy for use from Inko via FFI"
license = "MPL-2.0"
repository = "https://github.com/jhult/inko-tantivy"
authors = ["Jonathan Hult"]

[lib]
name = "tantivy_c"
crate-type = ["cdylib"]

[dependencies]
tantivy = "^0.25"
libc = "^0.2.182"
regex = "1.12"

# Disable zstd legacy format support to avoid cross-compile issues with zigbuild
[dependencies.zstd-sys]
version = "2"
default-features = false
features = ["zdict_builder"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"
