header:
  license:
    spdx-id: MPL-2.0
  paths:
    - "**"
  paths-ignore:
    - "dist"
    - "target"
    - "build"
    - "**/*.md"
    - "LICENSE"
    - ".git/**"
    - ".beads/**"
    - ".gitattributes"
    - "inko.pkg"
  comment: on-failure
  license-location-threshold: 80

  language:
    Pkl:
      extensions:
        - ".pkl"
      comment_style_id: SlashAsterisk
    Inko:
      extensions:
        - ".inko"
      comment_style_id: Hashtag

